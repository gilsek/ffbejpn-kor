<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFBE 오프라인 한글판 — 소환(가챠) 테이블</title>
<style>
:root {
  --bg: #0b101b;
  --panel: #131c2e;
  --panel2: #19253d;
  --border: #273859;
  --text: #eef3ff;
  --muted: #8ea2c8;
  --accent: #4c9aff;
  --nv: #ff6b9d;
  --nv-bg: rgba(255, 107, 157, 0.14);
  --r5: #f5c451;
  --r5-bg: rgba(245, 196, 81, 0.14);
  --r4: #c8a2ff;
  --r4-bg: rgba(200, 162, 255, 0.14);
  --r3: #5ec8ff;
  --r3-bg: rgba(94, 200, 255, 0.14);
  --r12: #9ab0d6;
  --r12-bg: rgba(154, 176, 214, 0.14);
  --hi: rgba(245, 196, 81, 0.25);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-size: 14px;
  line-height: 1.45;
}
header {
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #121b2e 0%, #0b101b 100%);
}
.container { max-width: 1020px; margin: 0 auto; padding: 0 12px; }
h1 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; }
.notice {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(76, 154, 255, 0.1);
  border: 1px solid rgba(76, 154, 255, 0.35);
  font-size: 12.5px;
  color: #cfe3ff;
}
.controls {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(11, 16, 27, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
}
.search-row { display: flex; gap: 8px; margin-bottom: 8px; }
.search-row input {
  flex: 1;
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: #070b13;
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.search-row input:focus { border-color: var(--accent); }
.btn {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.pill.active { background: #1e4280; border-color: var(--accent); color: #fff; }
.summary-bar {
  padding: 10px 0 4px;
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.banner-list { padding: 6px 0 48px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.card-head {
  padding: 12px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.card-head:hover { background: rgba(255,255,255,0.02); }
.card-title-wrap { min-width: 0; flex: 1; }
.card-title { font-size: 15px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bid { font-family: monospace; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.tab-tag {
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px;
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
}
.card-sub { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 5px; }
.rbadge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.rb-nv { color: var(--nv); background: var(--nv-bg); border: 1px solid rgba(255,107,157,0.35); }
.rb-r5 { color: var(--r5); background: var(--r5-bg); border: 1px solid rgba(245,196,81,0.35); }
.rb-r4 { color: var(--r4); background: var(--r4-bg); border: 1px solid rgba(200,162,255,0.35); }
.rb-r3 { color: var(--r3); background: var(--r3-bg); border: 1px solid rgba(94,200,255,0.35); }
.rb-r12 { color: var(--r12); background: var(--r12-bg); border: 1px solid rgba(154,176,214,0.35); }
.chev { font-size: 12px; color: var(--muted); flex-shrink: 0; }
.card-body { border-top: 1px solid var(--border); padding: 12px 14px; background: #0f1727; }
.r-group { margin-bottom: 14px; }
.r-group:last-child { margin-bottom: 0; }
.r-group-head { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.unit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 8px;
}
.u-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 9px;
  background: var(--panel);
  border: 1px solid rgba(39, 56, 89, 0.75);
  font-size: 12.5px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.u-item:hover { border-color: var(--accent); transform: translateY(-1px); }
.u-item.matched {
  background: var(--hi);
  border-color: var(--r5);
}
.u-sprite {
  width: 64px;
  height: 64px;
  object-fit: contain;
  image-rendering: pixelated;
  flex-shrink: 0;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 8px;
  padding: 3px;
}
.u-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.u-jp { display: block; font-size: 11px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.u-right { text-align: right; flex-shrink: 0; font-family: monospace; font-size: 11.5px; color: var(--muted); }
.u-rate { color: var(--text); font-weight: 700; display: block; font-size: 12.5px; }
details.filler-box {
  margin-top: 12px;
  border-top: 1px dashed var(--border);
  padding-top: 10px;
}
details.filler-box summary {
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
}
.empty { text-align: center; padding: 36px 12px; color: var(--muted); }

/* Character Detail Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(5, 8, 16, 0.82);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
}
.modal-bg.open { display: flex; }
.modal {
  width: 100%;
  max-width: 820px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
}
.m-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.m-title { font-size: 17px; font-weight: 800; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.m-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.m-head-actions { display: flex; gap: 6px; flex-shrink: 0; }
.m-body { padding: 14px 16px 18px; }
.stage {
  position: relative;
  min-height: 220px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background:
    linear-gradient(rgba(76, 154, 255, 0.06) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(76, 154, 255, 0.06) 1px, transparent 1px) 0 0 / 24px 24px,
    radial-gradient(circle at 50% 60%, #1a2847 0%, #0a101d 75%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 18px 12px;
  overflow: hidden;
}
.stage img {
  image-rendering: pixelated;
  max-width: 100%;
  object-fit: contain;
  transition: transform 0.15s ease;
}
.stage-note {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--muted);
  text-align: center;
}
.zoom-bar {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
}
.zoom-btn {
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: rgba(11, 16, 27, 0.85);
  color: var(--muted);
  cursor: pointer;
}
.zoom-btn.active { border-color: var(--accent); color: #fff; background: #1e4280; }
.motion-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.m-section { margin-top: 16px; }
.m-sec-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
@media (min-width: 520px) {
  .stat-grid { grid-template-columns: repeat(6, 1fr); }
}
.stat-box {
  background: #0d1424;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
  text-align: center;
}
.stat-k { font-size: 11px; color: var(--muted); }
.stat-v { font-size: 13.5px; font-weight: 800; font-family: monospace; margin-top: 2px; }
.appear-list { display: flex; flex-direction: column; gap: 6px; }
.appear-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: #0d1424;
  border: 1px solid var(--border);
  cursor: pointer;
}
.appear-row:hover { border-color: var(--accent); }
.appear-left { min-width: 0; }
.appear-name { font-weight: 700; font-size: 13px; }
.appear-meta { font-size: 11.5px; color: var(--muted); }
.appear-rate { font-family: monospace; font-weight: 800; font-size: 13px; color: var(--r5); flex-shrink: 0; }
.trust-list { display: flex; flex-direction: column; gap: 8px; }
.trust-card {
  background: #0d1424;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.trust-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tbadge { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
.tb-tmr { color: #5ec8ff; background: rgba(94, 200, 255, 0.14); border: 1px solid rgba(94, 200, 255, 0.35); }
.tb-stmr { color: #f5c451; background: rgba(245, 196, 81, 0.14); border: 1px solid rgba(245, 196, 81, 0.35); }
.trust-name { font-weight: 800; font-size: 13.5px; color: var(--text); }
.trust-kind {
  font-size: 11.5px;
  color: var(--muted);
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--panel2);
  border: 1px solid var(--border);
}
.trust-stats { margin-top: 6px; font-family: monospace; font-size: 12px; font-weight: 700; color: #9ad1ff; }
.trust-effects { margin: 6px 0 0; padding-left: 16px; font-size: 12px; color: #d5e2fb; }
.trust-effects li { margin: 2px 0; }

/* Search Enhancements & Role Badges */
.search-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  margin-bottom: 8px;
}
.quick-examples { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
.ex-chip {
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: #b7c8eb;
  font-size: 11px;
  cursor: pointer;
}
.ex-chip:hover { border-color: var(--accent); color: #fff; }
.skills-status { font-size: 11.5px; color: var(--muted); }
.skills-status.ready { color: #7ee2b8; }
.filter-stack { display: flex; flex-direction: column; gap: 6px; }
.filter-subrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.pill-sm { padding: 3px 9px; font-size: 11.5px; }
.role-tag {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 5px;
  background: rgba(76, 154, 255, 0.14);
  border: 1px solid rgba(76, 154, 255, 0.3);
  color: #a9ceff;
}
.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.view-toggle button {
  border: 0;
  background: var(--panel);
  color: var(--muted);
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.view-toggle button.active { background: #1e4280; color: #fff; }

/* Quick Unit Results / Dex */
.quick-units-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 6px 0 12px;
}
.quick-units-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: 800;
}
.qu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
}
.qu-card {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 9px;
  background: #0d1424;
  border: 1px solid rgba(39, 56, 89, 0.85);
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.qu-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.qu-info { flex: 1; min-width: 0; }
.qu-top { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.qu-name { font-weight: 800; font-size: 13px; }
.qu-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.qu-reason {
  margin-top: 4px;
  font-size: 11.5px;
  color: #f5d887;
  line-height: 1.35;
  word-break: break-word;
}
.more-btn-wrap { text-align: center; margin-top: 10px; }

/* Skills Section in Modal */
.skill-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.skill-filter-input {
  width: 100%;
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #070b13;
  color: var(--text);
  font-size: 12.5px;
  margin-bottom: 8px;
  outline: none;
}
.skill-filter-input:focus { border-color: var(--accent); }
.skill-list { display: flex; flex-direction: column; gap: 7px; }
.skill-grid { display: grid; grid-template-columns: 1fr; gap: 7px; }
@media (min-width: 600px) {
  .skill-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: stretch; }
}
.skill-grid .empty { grid-column: 1 / -1; }
.skill-card {
  background: #0d1424;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 11px;
}
.skill-card.matched { background: rgba(245, 196, 81, 0.12); border-color: var(--r5); }
.skill-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sbadge { font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; }
.sb-ls { color: #ffd166; background: rgba(255, 209, 102, 0.16); border: 1px solid rgba(255, 209, 102, 0.4); }
.sb-lb { color: #ff6b9d; background: rgba(255, 107, 157, 0.16); border: 1px solid rgba(255, 107, 157, 0.4); }
.sb-act { color: #ff9f6e; background: rgba(255, 159, 110, 0.14); border: 1px solid rgba(255, 159, 110, 0.35); }
.sb-pas { color: #7ee2b8; background: rgba(126, 226, 184, 0.14); border: 1px solid rgba(126, 226, 184, 0.35); }
.sb-mw { color: #f0f6ff; background: rgba(240, 246, 255, 0.14); border: 1px solid rgba(240, 246, 255, 0.35); }
.sb-mb { color: #c8a2ff; background: rgba(200, 162, 255, 0.14); border: 1px solid rgba(200, 162, 255, 0.35); }
.sb-mg { color: #6ee7b7; background: rgba(110, 231, 183, 0.14); border: 1px solid rgba(110, 231, 183, 0.35); }
.sb-ml { color: #5ec8ff; background: rgba(94, 200, 255, 0.14); border: 1px solid rgba(94, 200, 255, 0.35); }
.skill-name { font-weight: 800; font-size: 13px; color: var(--text); }
.skill-mp { font-family: monospace; font-size: 11px; font-weight: 700; color: #72c4ff; }
.skill-cond { font-size: 11px; color: var(--muted); margin-left: auto; }
.skill-desc { margin-top: 5px; font-size: 12px; color: #d5e2fb; white-space: pre-line; line-height: 1.45; }
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>FFBE 오프라인 한글판 — 소환(가챠) 테이블</h1>
    <div class="meta" id="meta-line"></div>
    <div class="notice">
      유닛을 클릭하면 SD 애니메이션(대기·공격·마법·리미트·승리), 능력치, 트마/슈트마 보상, <b>리더 스킬·LB·습득 스킬</b>, 출현 배너를 확인할 수 있습니다.
      초성 검색(예: <code>ㅁㅇㅍㄴ</code>), 다중 키워드(예: <code>화속성 내성</code>), 역할/스킬 효과 검색을 지원합니다.
    </div>
  </div>
</header>

<div class="controls">
  <div class="container">
    <div class="search-row">
      <input id="q" type="search" placeholder="유닛명(초성 가능), 스킬명·효과, 트마/슈트마, 역할, 배너명 검색... (예: 전체 감싸기, 화속성 내성, ㅁㅇㅍㄴ)">
      <button class="btn" id="btn-clear" onclick="clearSearch()">초기화</button>
    </div>
    <div class="search-meta-row">
      <div class="quick-examples">
        <span>추천 검색:</span>
        <button class="ex-chip" onclick="applyExample('전체 감싸기')">전체 감싸기</button>
        <button class="ex-chip" onclick="applyExample('화속성 내성')">화속성 내성</button>
        <button class="ex-chip" onclick="applyExample('3회 행동')">3회 행동</button>
        <button class="ex-chip" onclick="applyExample('리본')">리본</button>
        <button class="ex-chip" onclick="applyExample('전체 부활')">전체 부활</button>
        <button class="ex-chip" onclick="applyExample('ㅁㅇㅍㄴ')">ㅁㅇㅍㄴ</button>
      </div>
      <span class="skills-status" id="skills-status">스킬 데이터 불러오는 중...</span>
    </div>
    <div class="filter-stack">
      <div class="filter-row">
        <div class="pills" id="tab-pills">
          <button class="pill active" data-tab="all" onclick="setTab('all')">전체</button>
          <button class="pill" data-tab="ffbe" onclick="setTab('ffbe')">FFBE</button>
          <button class="pill" data-tab="ff_series" onclick="setTab('ff_series')">FF 시리즈</button>
          <button class="pill" data-tab="collaborations" onclick="setTab('collaborations')">콜라보</button>
        </div>
        <div class="pills" id="rar-pills">
          <button class="pill active" data-rar="all" onclick="setRar('all')">전체 등급</button>
          <button class="pill" data-rar="7" onclick="setRar('7')">NV</button>
          <button class="pill" data-rar="5" onclick="setRar('5')">★5</button>
          <button class="pill" data-rar="4" onclick="setRar('4')">★4</button>
          <button class="pill" data-rar="3" onclick="setRar('3')">★3</button>
        </div>
      </div>
      <div class="filter-subrow">

<script>
const DATA = JSON.parse(document.getElementById('gacha-data').textContent);
const TAB_LABELS = { ffbe: 'FFBE', ff_series: 'FF 시리즈', collaborations: '콜라보' };
const RAR_META = {
  7: { label: 'NV', cls: 'rb-nv' },
  5: { label: '★5', cls: 'rb-r5' },
  4: { label: '★4', cls: 'rb-r4' },
  3: { label: '★3', cls: 'rb-r3' },
  2: { label: '★2', cls: 'rb-r12' },
  1: { label: '★1', cls: 'rb-r12' },
};
const ROLE_KO = {
  1: '물리공격', 2: '마법공격', 3: '물리방어', 4: '마법방어',
  5: '회복', 6: '지원', 7: '방해', 8: '만능',
};
const ROLE_ALIASES = {
  1: '물딜 물리딜러 어태커',
  2: '마딜 마법딜러 메이지',
  3: '물탱 물리탱커 탱커',
  4: '마탱 마법탱커 탱커',
  5: '힐러 회복러',
  6: '버퍼 서포터',
  7: '디버퍼 디버프',
  8: '하이브리드 올라운더',
};
const MAGIC_TYPE_META = {
  1: { label: '백마법', cls: 'sb-mw' },
  2: { label: '흑마법', cls: 'sb-mb' },
  3: { label: '녹마법', cls: 'sb-mg' },
  4: { label: '청마법', cls: 'sb-ml' },
};
const MOTIONS = [
  ['1idle', '대기'],
  ['standby', '전투대기'],
  ['2move', '이동'],
  ['3atk', '공격'],
  ['magicatk', '마법'],
  ['limitatk', '리미트'],
  ['win', '승리'],
];
const SPRITE_BASE = 'https://raw.githubusercontent.com/arandooku/ffbe-sprites/main';
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

let activeTab = 'all';
let activeRar = 'all';
let activeRole = 'all';
let searchScope = 'all';
let viewMode = 'banners';
let query = '';
let quickLimit = 48;
const expanded = new Set();

let currentUid = null;
let currentMotion = '1idle';
let currentZoom = 2;
let modalSkillTab = 'all';
let modalSkillQuery = '';

document.getElementById('meta-line').innerHTML =
  `<span>총 배너: <b>${DATA.banner_count}개</b></span>` +
  `<span>수록 유닛: <b>${DATA.unit_count.toLocaleString()}종</b></span>` +
  `<span>갱신: <b>${DATA.built_at}</b></span>`;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function norm(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, '');
}

function chosung(s) {
  let out = '';
  for (const ch of String(s || '')) {
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      out += CHO[Math.floor((code - 0xAC00) / 588)];
    } else if (code >= 0x3131 && code <= 0x314E) {
      out += ch;
    }
  }
  return out;
}

function isChosungToken(tok) {
  return /^[ㄱ-ㅎ]+$/.test(tok);
}

function unitInfo(uid) {
  return DATA.units[uid] || [uid, '', 0, 0, [0, 0, 0, 0, 0, 0], '', '', '', [], null, null];
}

function tokenize(q) {
  return String(q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
}

function tokenMatchesField(tok, normStr, choStr) {
  if (!tok) return true;
  if (isChosungToken(tok)) return !!choStr && choStr.includes(tok);
  return !!normStr && normStr.includes(tok);
}

const UNIT_IDX = Object.create(null);
const UNIT_META = Object.create(null);

function buildBaseIndex() {
  const rewards = DATA.rewards || {};
  for (const uid of Object.keys(DATA.units)) {
    const [ko, jp, rar, , , tmrKey, stmrKey, series, roles, lb, ls] = unitInfo(uid);
    const roleStr = (roles || []).map(r => (ROLE_KO[r] || '') + ' ' + (ROLE_ALIASES[r] || '')).join(' ');
    const tmr = tmrKey ? rewards[tmrKey] : null;
    const stmr = stmrKey ? rewards[stmrKey] : null;

    const trustParts = [];
    if (tmr) trustParts.push(tmr[0], tmr[1] || '', tmr[2] || '', ...(tmr[3] || []));
    if (stmr) trustParts.push(stmr[0], stmr[1] || '', stmr[2] || '', ...(stmr[3] || []));
    const trustText = trustParts.join(' ');

    const lbName = lb ? (lb[0] || '') : '';
    const lbExp = lb ? (lb[1] || '') : '';
    const lsName = ls ? (ls[0] || '') : '';
    const lsExp = ls ? (ls[1] || '') : '';

    UNIT_IDX[uid] = {
      uid: uid.toLowerCase(),
      koNorm: norm(ko),
      koCho: chosung(ko),
      jpNorm: norm(jp),
      roleNorm: norm(roleStr),
      tmrNameNorm: norm(tmr ? tmr[0] : ''),
      tmrNameCho: chosung(tmr ? tmr[0] : ''),
      stmrNameNorm: norm(stmr ? stmr[0] : ''),
      stmrNameCho: chosung(stmr ? stmr[0] : ''),
      trustNorm: norm(trustText),
      trustCho: chosung(trustText),
      lbNameNorm: norm(lbName),
      lbNameCho: chosung(lbName),
      lbExpNorm: norm(lbExp),
      lsNameNorm: norm(lsName),
      lsNameCho: chosung(lsName),
      lsExpNorm: norm(lsExp),
      skNameNorm: '',
      skNameCho: '',
      skExpNorm: '',
      skEntries: null,
      series: series || '',
    };
    UNIT_META[uid] = { tabs: new Set(), rarities: new Set(), bannerCount: 0, maxRarity: rar || 0 };
  }

  for (const b of DATA.banners) {
    for (const [uid, r] of b.native) {
      const m = UNIT_META[uid];
      if (m) {
        m.tabs.add(b.tab);
        m.rarities.add(String(r));
        m.bannerCount++;
        if (r > m.maxRarity) m.maxRarity = r;
      }
    }
    for (const [uid, r] of b.filler) {
      const m = UNIT_META[uid];
      if (m) {
        m.tabs.add(b.tab);
        m.rarities.add(String(r));
        m.bannerCount++;
        if (r > m.maxRarity) m.maxRarity = r;
      }
    }
  }
}

function buildSkillIndex() {
  const sk = window.GACHA_SKILLS;
  if (!sk) return;
  const ab = sk.ab || {};
  const mg = sk.mg || {};
  const us = sk.us || {};
  for (const uid of Object.keys(UNIT_IDX)) {
    const idx = UNIT_IDX[uid];
    const list = us[idx.series] || [];
    const names = [];
    const exps = [];
    const entries = [];
    for (const [kind, sid] of list) {
      const row = kind === 0 ? ab[sid] : mg[sid];
      if (!row) continue;
      const sName = row[0] || '';
      const sExp = row[1] || '';
      names.push(sName);
      if (sExp) exps.push(sExp);
      entries.push([sName, sExp, norm(sName), chosung(sName), norm(sExp)]);
    }
    const nameStr = names.join(' ');
    idx.skNameNorm = norm(nameStr);
    idx.skNameCho = chosung(nameStr);
    idx.skExpNorm = norm(exps.join(' '));
    idx.skEntries = entries;
  }
  const stEl = document.getElementById('skills-status');
  if (stEl) {
    const total = Object.keys(ab).length + Object.keys(mg).length;
    stEl.textContent = `스킬 ${total.toLocaleString()}종 검색 준비됨`;
    stEl.classList.add('ready');
  }
}

window.__onSkillsLoaded = function() {
  buildSkillIndex();
  if (query.trim()) render();
  if (currentUid) renderModalSkills(currentUid);
};

buildBaseIndex();
if (window.GACHA_SKILLS) buildSkillIndex();

function snip(s, maxLen = 58) {
  const t = String(s || '').replace(/\s+/g, ' ').trim();
  return t.length > maxLen ? t.slice(0, maxLen) + '...' : t;
}

function searchUnit(uid, tokens, scope) {
  if (!tokens.length) return { matched: true, score: 0, reason: '' };
  const idx = UNIT_IDX[uid];
  if (!idx) return { matched: false, score: 0, reason: '' };
  const [ko, , , , , tmrKey, stmrKey, , , lb, ls] = unitInfo(uid);
  const rewards = DATA.rewards || {};
  const allowName = scope === 'all' || scope === 'name';
  const allowSkill = scope === 'all' || scope === 'skill';
  const allowTrust = scope === 'all' || scope === 'trust';

  let totalScore = 0;
  let bestReason = '';
  let bestReasonScore = -1;

  for (const rawTok of tokens) {
    const tok = rawTok.replace(/\s+/g, '');
    let tokScore = 0;
    let tokReason = '';

    if (allowName) {
      if (idx.uid.includes(tok)) {
        tokScore = Math.max(tokScore, 95);
        tokReason = `ID: ${uid}`;
      }
      if (tokenMatchesField(tok, idx.koNorm, idx.koCho)) {
        const sc = idx.koNorm === tok ? 120 : (idx.koNorm.startsWith(tok) ? 105 : 90);
        if (sc > tokScore) { tokScore = sc; tokReason = ''; }
      }
      if (!isChosungToken(tok) && idx.jpNorm.includes(tok)) {
        if (85 > tokScore) { tokScore = 85; tokReason = ''; }
      }
      if (!isChosungToken(tok) && idx.roleNorm.includes(tok)) {
        if (70 > tokScore) { tokScore = 70; tokReason = '역할 일치'; }
      }
    }

    if (allowTrust) {
      if (tokenMatchesField(tok, idx.tmrNameNorm, idx.tmrNameCho)) {
        if (75 > tokScore) {
          tokScore = 75;
          const t = rewards[tmrKey];
          tokReason = t ? `TMR: ${t[0]}` : 'TMR 일치';
        }
      } else if (tokenMatchesField(tok, idx.stmrNameNorm, idx.stmrNameCho)) {
        if (75 > tokScore) {
          tokScore = 75;
          const s = rewards[stmrKey];
          tokReason = s ? `STMR: ${s[0]}` : 'STMR 일치';
        }
      } else if (tokenMatchesField(tok, idx.trustNorm, idx.trustCho)) {
        if (52 > tokScore) {
          tokScore = 52;
          const t = rewards[tmrKey];
          const s = rewards[stmrKey];
          if (t && norm([t[0], t[1], t[2], ...(t[3]||[])].join(' ')).includes(tok)) {
            tokReason = `TMR 효과: ${t[0]}`;
          } else if (s) {
            tokReason = `STMR 효과: ${s[0]}`;
          } else {
            tokReason = '트마/슈트마 효과';
          }
        }
      }
    }

    if (allowSkill) {
      if (tokenMatchesField(tok, idx.lsNameNorm, idx.lsNameCho)) {
        if (68 > tokScore) { tokScore = 68; tokReason = ls ? `리더 스킬: ${ls[0]}` : '리더 스킬'; }
      } else if (!isChosungToken(tok) && idx.lsExpNorm.includes(tok)) {
        if (56 > tokScore) { tokScore = 56; tokReason = ls ? `리더 스킬: ${ls[0]} — ${snip(ls[1], 42)}` : '리더 스킬 효과'; }
      }

      if (tokenMatchesField(tok, idx.lbNameNorm, idx.lbNameCho)) {
        if (66 > tokScore) { tokScore = 66; tokReason = lb ? `LB: ${lb[0]}` : 'LB'; }
      } else if (!isChosungToken(tok) && idx.lbExpNorm.includes(tok)) {
        if (54 > tokScore) { tokScore = 54; tokReason = lb ? `LB: ${lb[0]} — ${snip(lb[1], 42)}` : 'LB 효과'; }
      }

      if (idx.skEntries) {
        if (tokenMatchesField(tok, idx.skNameNorm, idx.skNameCho)) {
          if (64 > tokScore) {
            tokScore = 64;
            const hit = idx.skEntries.find(e => tokenMatchesField(tok, e[2], e[3]));
            tokReason = hit ? `스킬: ${hit[0]}` : '습득 스킬';
          }
        } else if (!isChosungToken(tok) && idx.skExpNorm.includes(tok)) {
          if (50 > tokScore) {
            tokScore = 50;
            const hit = idx.skEntries.find(e => e[4].includes(tok));
            tokReason = hit ? `스킬: ${hit[0]} — ${snip(hit[1], 44)}` : '스킬 효과';
          }
        }
      }
    }

    if (tokScore === 0) return { matched: false, score: 0, reason: '' };
    totalScore += tokScore;
    if (tokReason && tokScore > bestReasonScore) {
      bestReasonScore = tokScore;
      bestReason = tokReason;
    }
  }
  return { matched: true, score: totalScore, reason: bestReason };
}

function unitMatchesRole(uid, roleFilter) {
  if (roleFilter === 'all') return true;
  const roles = unitInfo(uid)[8] || [];
  return roles.includes(Number(roleFilter));
}

function bannerMatchesTokens(b, tokens) {
  if (!tokens.length) return false;
  const bNorm = norm(b.name) + ' ' + norm(b.id);
  const bCho = chosung(b.name);
  return tokens.every(t => tokenMatchesField(t, bNorm, bCho));
}

function fmtRate(pct) {
  if (pct >= 1) return pct.toFixed(2) + '%';
  if (pct >= 0.01) return pct.toFixed(3) + '%';
  return pct.toFixed(4) + '%';
}

function spriteUrl(uid) {
  return `${SPRITE_BASE}/unit_illustrations/unit_ills_${uid}.png`;
}

function motionGifUrl(uid, motion) {
  return `${SPRITE_BASE}/animated_gifs/unit_${uid}_${motion}_opac.gif`;
}

function onSpriteError(img, uid) {
  if (!img.dataset.fb) {
    img.dataset.fb = '1';
    img.src = `${SPRITE_BASE}/unit_icons/unit_icon_${uid}.png`;
  } else {
    img.style.display = 'none';
  }
}

function tierBadges(tiers) {
  const out = [];
  if (tiers.nv) out.push(`<span class="rbadge rb-nv">NV ${tiers.nv}%</span>`);
  if (tiers.r5) out.push(`<span class="rbadge rb-r5">★5 ${tiers.r5}%</span>`);
  if (tiers.r34) out.push(`<span class="rbadge rb-r34">★3~4 ${tiers.r34}%</span>`);
  if (tiers.r12) out.push(`<span class="rbadge rb-r12">★1~2 ${tiers.r12}%</span>`);
  return out.join('');
}

function roleBadgesHtml(roles) {
  if (!Array.isArray(roles) || !roles.length) return '';
  return roles.map(r => `<span class="role-tag">${esc(ROLE_KO[r] || r)}</span>`).join('');
}

function renderUnitGroup(entries, tokens, rarFilter) {
  const byRar = new Map();
  for (const [uid, r, pct] of entries) {
    if (rarFilter !== 'all' && String(r) !== rarFilter) continue;
    if (!unitMatchesRole(uid, activeRole)) continue;
    if (!byRar.has(r)) byRar.set(r, []);
    byRar.get(r).push([uid, pct]);
  }
  const rars = [...byRar.keys()].sort((a, b) => b - a);
  if (!rars.length) return '';
  return rars.map(r => {
    const meta = RAR_META[r] || { label: `★${r}`, cls: 'rb-r12' };
    const list = byRar.get(r);
    const sumPct = list.reduce((acc, x) => acc + x[1], 0);
    const itemsHtml = list.map(([uid, pct]) => {
      const [ko, jp] = unitInfo(uid);
      const hit = tokens.length > 0 && searchUnit(uid, tokens, searchScope).matched;
      return `<div class="u-item${hit ? ' matched' : ''}" onclick="openUnit('${esc(uid)}')">
        <img class="u-sprite" loading="lazy" decoding="async" src="${spriteUrl(uid)}" alt="" onerror="onSpriteError(this,'${esc(uid)}')">
        <div class="u-name" title="${esc(ko)}">${esc(ko)}${jp ? `<span class="u-jp">${esc(jp)}</span>` : ''}</div>
        <div class="u-right"><span class="u-rate">${fmtRate(pct)}</span><span>${esc(uid)}</span></div>
      </div>`;
    }).join('');
    return `<div class="r-group">
      <div class="r-group-head"><span class="rbadge ${meta.cls}">${meta.label}</span><span>${list.length}명 (합계 ${sumPct.toFixed(2)}%)</span></div>
      <div class="unit-grid">${itemsHtml}</div>
    </div>`;
  }).join('');
}

function renderBody(b, tokens, rarFilter) {
  const nativeHtml = renderUnitGroup(b.native, tokens, rarFilter);
  let fillerHtml = '';
  if (b.filler.length) {
    const fSum = b.filler.reduce((acc, x) => acc + x[2], 0);
    const fInner = renderUnitGroup(b.filler, tokens, rarFilter);
    if (fInner) {
      const openAttr = tokens.length && b.filler.some(([uid]) => unitMatchesRole(uid, activeRole) && searchUnit(uid, tokens, searchScope).matched) ? ' open' : '';
      fillerHtml = `<details class="filler-box"${openAttr}>
        <summary>공용 ★3~4 베이스 풀 ${b.filler.length}종 (합계 ${fSum.toFixed(2)}%)</summary>
        <div style="margin-top:8px;">${fInner}</div>
      </details>`;
    }
  }
  return (nativeHtml || '<div class="empty" style="padding:12px;">선택한 조건에 해당하는 자체 유닛이 없습니다.</div>') + fillerHtml;
}

function collectMatchingUnits(tokens) {
  const results = [];
  for (const uid of Object.keys(DATA.units)) {
    const m = UNIT_META[uid];
    if (!m) continue;
    if (activeTab !== 'all' && !m.tabs.has(activeTab)) continue;
    if (activeRar !== 'all' && !m.rarities.has(activeRar)) continue;
    if (!unitMatchesRole(uid, activeRole)) continue;
    const res = searchUnit(uid, tokens, searchScope);
    if (!res.matched) continue;
    results.push({ uid, score: res.score, reason: res.reason, maxRarity: m.maxRarity, bannerCount: m.bannerCount });
  }
  results.sort((a, b) => (b.score - a.score) || (b.maxRarity - a.maxRarity) || (b.bannerCount - a.bannerCount) || a.uid.localeCompare(b.uid));
  return results;
}

function renderQuickUnits(results, isDexMode) {
  const wrap = document.getElementById('quick-units');
  if (!isDexMode && !query.trim() && activeRole === 'all') {
    wrap.innerHTML = '';
    return;
  }
  if (!results.length) {
    wrap.innerHTML = isDexMode
      ? '<div class="empty">조건에 맞는 유닛이 없습니다.</div>'
      : '';
    return;
  }
  const shown = results.slice(0, quickLimit);
  const title = isDexMode
    ? `유닛 도감 (${results.length.toLocaleString()}명)`
    : `유닛 바로보기 (${results.length.toLocaleString()}명 일치 — 클릭하여 상세·스킬 확인)`;

  const cardsHtml = shown.map(({ uid, reason }) => {
    const [ko, jp, rarity, , , , , , roles] = unitInfo(uid);
    const rMeta = RAR_META[rarity] || { label: `★${rarity || '?'}`, cls: 'rb-r12' };
    return `<div class="qu-card" onclick="openUnit('${esc(uid)}')">
      <img class="u-sprite" loading="lazy" decoding="async" src="${spriteUrl(uid)}" alt="" onerror="onSpriteError(this,'${esc(uid)}')">
      <div class="qu-info">
        <div class="qu-top">
          <span class="rbadge ${rMeta.cls}">${rMeta.label}</span>
          <span class="qu-name">${esc(ko)}</span>
          ${roleBadgesHtml(roles)}
        </div>
        <div class="qu-sub">${jp ? esc(jp) + ' · ' : ''}ID: ${esc(uid)}</div>
        ${reason ? `<div class="qu-reason">${esc(reason)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  const moreBtn = results.length > shown.length
    ? `<div class="more-btn-wrap"><button class="btn" onclick="showMoreUnits()">더 보기 (${shown.length} / ${results.length})</button></div>`
    : '';

  wrap.innerHTML = `<div class="quick-units-wrap">
    <div class="quick-units-head"><span>${title}</span></div>
    <div class="qu-grid">${cardsHtml}</div>
    ${moreBtn}
  </div>`;
}

function showMoreUnits() {
  quickLimit += 60;
  render();
}

function render() {
  const tokens = tokenize(query);
  const isDexMode = viewMode === 'units';
  document.getElementById('banner-expand-btns').style.display = isDexMode ? 'none' : 'flex';

  const unitResults = (isDexMode || tokens.length || activeRole !== 'all')
    ? collectMatchingUnits(tokens)
    : [];
  renderQuickUnits(unitResults, isDexMode);

  const listEl = document.getElementById('banner-list');
  if (isDexMode) {
    document.getElementById('result-count').textContent =
      `유닛 도감: ${unitResults.length.toLocaleString()} / ${DATA.unit_count.toLocaleString()}종`;
    listEl.innerHTML = '';
    return;
  }

  const allowBannerName = searchScope === 'all' || searchScope === 'name';
  const filtered = DATA.banners.filter(b => {
    if (activeTab !== 'all' && b.tab !== activeTab) return false;
    const entryMatch = (e) => (activeRar === 'all' || String(e[1]) === activeRar) && unitMatchesRole(e[0], activeRole);
    if (!b.native.some(entryMatch) && !b.filler.some(entryMatch)) return false;
    if (!tokens.length) return true;
    if (allowBannerName && bannerMatchesTokens(b, tokens)) return true;
    return b.native.some(e => entryMatch(e) && searchUnit(e[0], tokens, searchScope).matched) ||
           b.filler.some(e => entryMatch(e) && searchUnit(e[0], tokens, searchScope).matched);
  });

  const unitSummary = tokens.length ? ` · 유닛 ${unitResults.length}명 일치` : '';
  document.getElementById('result-count').textContent =
    `표시 중: ${filtered.length} / ${DATA.banner_count}개 배너${unitSummary}`;

  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty">조건에 맞는 배너나 유닛이 없습니다.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(b => {
    const hasUnitHit = tokens.length > 0 && (
      b.native.some(([uid]) => unitMatchesRole(uid, activeRole) && searchUnit(uid, tokens, searchScope).matched) ||
      b.filler.some(([uid]) => unitMatchesRole(uid, activeRole) && searchUnit(uid, tokens, searchScope).matched)
    );
    const isOpen = expanded.has(b.id) || hasUnitHit;
    const tabName = TAB_LABELS[b.tab] || b.tab;
    return `<div class="card" id="card-${esc(b.id)}">
      <div class="card-head" onclick="toggleCard('${esc(b.id)}')">
        <div class="card-title-wrap">
          <div class="card-title">
            <span class="tab-tag">${esc(tabName)}</span>
            <span>${esc(b.name)}</span>
            <span class="bid">#${esc(b.id)}</span>
          </div>
          <div class="card-sub">
            <span class="badges">${tierBadges(b.tiers)}</span>
            <span>자체 ${b.native.length}명${b.filler.length ? ` + 공용 ${b.filler.length}명` : ''}</span>
            <span>${esc(b.cost)}</span>
          </div>
        </div>
        <span class="chev">${isOpen ? '▲ 접기' : '▼ 펼치기'}</span>
      </div>
      ${isOpen ? `<div class="card-body">${renderBody(b, tokens, activeRar)}</div>` : ''}
    </div>`;
  }).join('');
}

function loadStageImage() {
  const img = document.getElementById('m-img');
  const note = document.getElementById('m-stage-note');
  const uid = currentUid;
  const motion = currentMotion;
  if (!uid) return;
  note.textContent = '모션 불러오는 중...';
  img.style.display = '';
  img.onload = () => {
    if (img.dataset.mode === 'static') {
      note.textContent = '정지 SD 스프라이트 표시 중 (모션 GIF 미지원 유닛)';
    } else {
      const mObj = MOTIONS.find(x => x[0] === motion);
      note.textContent = `${mObj ? mObj[1] : motion} 모션 (${currentZoom}x)`;
    }
    applyZoomStyle();
  };
  img.onerror = () => {
    if (img.dataset.mode !== 'static') {
      img.dataset.mode = 'static';
      img.src = spriteUrl(uid);
      note.textContent = '정지 SD 스프라이트 표시 중 (모션 GIF 미지원 유닛)';
    } else {
      img.style.display = 'none';
      note.textContent = '이미지를 불러올 수 없습니다.';
    }
  };
  img.dataset.mode = 'gif';
  img.src = motionGifUrl(uid, motion);
}

function applyZoomStyle() {
  const img = document.getElementById('m-img');
  img.style.transform = `scale(${currentZoom})`;
  img.style.margin = currentZoom > 1 ? `${(currentZoom - 1) * 32}px 0` : '0';
}

function setZoom(z) {
  currentZoom = z;
  document.querySelectorAll('#zoom-bar .zoom-btn').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.z) === z);
  });
  applyZoomStyle();
  const note = document.getElementById('m-stage-note');
  if (document.getElementById('m-img').dataset.mode === 'gif') {
    const mObj = MOTIONS.find(x => x[0] === currentMotion);
    note.textContent = `${mObj ? mObj[1] : currentMotion} 모션 (${currentZoom}x)`;
  }
}

function setMotion(motion) {
  currentMotion = motion;
  document.querySelectorAll('#motion-bar .pill').forEach(el => {
    el.classList.toggle('active', el.dataset.m === motion);
  });
  loadStageImage();
}

function renderTrustCard(badgeLabel, badgeCls, rKey) {
  if (!rKey) return '';
  const rw = (DATA.rewards || {})[rKey];
  if (!rw) return '';
  const [rName, rKind, rStats, rEffects] = rw;
  const effHtml = Array.isArray(rEffects) && rEffects.length
    ? `<ul class="trust-effects">${rEffects.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`
    : '';
  return `<div class="trust-card">
    <div class="trust-head">
      <span class="tbadge ${badgeCls}">${badgeLabel}</span>
      <span class="trust-name">${esc(rName)}</span>
      ${rKind ? `<span class="trust-kind">${esc(rKind)}</span>` : ''}
    </div>
    ${rStats ? `<div class="trust-stats">${esc(rStats)}</div>` : ''}
    ${effHtml}
  </div>`;
}

function formatAcquireCond(rar, lv, nv, ex) {
  const parts = [];
  if (nv) parts.push('NV');
  else if (rar > 0) parts.push(`★${rar}`);
  if (ex > 0) parts.push(`EX+${ex}`);
  if (lv > 1) parts.push(`Lv.${lv}`);
  else if (!parts.length) parts.push('기본 Lv.1');
  else parts.push('Lv.1');
  return parts.join(' ');
}

function setModalSkillTab(tab) {
  modalSkillTab = tab;
  if (currentUid) renderModalSkills(currentUid);
}

function onModalSkillInput(val) {
  modalSkillQuery = val;
  if (currentUid) renderModalSkills(currentUid, true);
}

function renderModalSkills(uid, keepInputFocus = false) {
  const sec = document.getElementById('m-skills-sec');
  const info = unitInfo(uid);
  const series = info[7] || '';
  const lb = info[9];
  const ls = info[10];

  const mainTokens = tokenize(query);
  const localTokens = tokenize(modalSkillQuery);
  const highlightTokens = localTokens.length ? localTokens : mainTokens;

  let html = '';
  if (ls && (ls[0] || ls[1])) {
    const isHit = highlightTokens.length > 0 && highlightTokens.every(t =>
      tokenMatchesField(t, norm((ls[0] || '') + ' ' + (ls[1] || '')), chosung(ls[0] || ''))
    );
    html += `<div class="m-sec-title">리더 스킬</div>
      <div class="skill-list" style="margin-bottom:14px;">
        <div class="skill-card${isHit ? ' matched' : ''}">
          <div class="skill-head">
            <span class="sbadge sb-ls">리더 스킬</span>
            <span class="skill-name">${esc(ls[0] || '리더 스킬')}</span>
          </div>
          ${ls[1] ? `<div class="skill-desc">${esc(ls[1])}</div>` : ''}
        </div>
      </div>`;
  }

  if (lb && (lb[0] || lb[1])) {
    const isHit = highlightTokens.length > 0 && highlightTokens.every(t =>
      tokenMatchesField(t, norm((lb[0] || '') + ' ' + (lb[1] || '')), chosung(lb[0] || ''))
    );
    html += `<div class="m-sec-title">리미트 버스트 (LB)</div>
      <div class="skill-list" style="margin-bottom:14px;">
        <div class="skill-card${isHit ? ' matched' : ''}">
          <div class="skill-head">
            <span class="sbadge sb-lb">LB</span>
            <span class="skill-name">${esc(lb[0] || '리미트 버스트')}</span>
          </div>
          ${lb[1] ? `<div class="skill-desc">${esc(lb[1])}</div>` : ''}
        </div>
      </div>`;
  }

  const sk = window.GACHA_SKILLS;
  if (!sk) {
    html += `<div class="m-sec-title">습득 스킬</div><div class="empty" style="padding:14px;">스킬 데이터 불러오는 중...</div>`;
    sec.innerHTML = html;
    return;
  }

  const rawList = (sk.us || {})[series] || [];
  const items = [];
  for (const [kind, sid, rar, lv, nv, ex] of rawList) {
    const row = kind === 0 ? (sk.ab || {})[sid] : (sk.mg || {})[sid];
    if (!row) continue;
    let cat = 'act';
    let badgeLabel = '액티브';
    let badgeCls = 'sb-act';
    if (kind === 1) {
      cat = 'mag';
      const mt = MAGIC_TYPE_META[row[3]] || MAGIC_TYPE_META[1];
      badgeLabel = mt.label;
      badgeCls = mt.cls;
    } else if (row[3] === 1) {
      cat = 'pas';
      badgeLabel = '패시브';
      badgeCls = 'sb-pas';
    }
    items.push({
      name: row[0] || sid,
      exp: row[1] || '',
      mp: row[2] || 0,
      cat,
      badgeLabel,
      badgeCls,
      cond: formatAcquireCond(rar, lv, nv, ex),
    });
  }

  const counts = { all: items.length, act: 0, pas: 0, mag: 0 };
  for (const it of items) counts[it.cat]++;

  const filtered = items.filter(it => {
    if (modalSkillTab !== 'all' && it.cat !== modalSkillTab) return false;
    if (!localTokens.length) return true;
    const nAll = norm(it.name + ' ' + it.exp);
    const cName = chosung(it.name);
    return localTokens.every(t => tokenMatchesField(t, nAll, cName));
  });

  const tabsHtml = [
    ['all', `전체 (${counts.all})`],
    ['act', `액티브 (${counts.act})`],
    ['pas', `패시브 (${counts.pas})`],
    ['mag', `마법 (${counts.mag})`],
  ].map(([k, lbl]) => `<button class="pill pill-sm${modalSkillTab === k ? ' active' : ''}" onclick="setModalSkillTab('${k}')">${lbl}</button>`).join('');

  const cardsHtml = filtered.length
    ? filtered.map(it => {
        const isHit = highlightTokens.length > 0 && highlightTokens.every(t =>
          tokenMatchesField(t, norm(it.name + ' ' + it.exp), chosung(it.name))
        );
        return `<div class="skill-card${isHit ? ' matched' : ''}">
          <div class="skill-head">
            <span class="sbadge ${it.badgeCls}">${it.badgeLabel}</span>
            <span class="skill-name">${esc(it.name)}</span>
            ${it.mp > 0 ? `<span class="skill-mp">MP ${it.mp}</span>` : ''}
            <span class="skill-cond">${esc(it.cond)}</span>
          </div>
          ${it.exp ? `<div class="skill-desc">${esc(it.exp)}</div>` : ''}
        </div>`;
      }).join('')
    : '<div class="empty" style="padding:14px;">해당 조건의 스킬이 없습니다.</div>';

  html += `<div class="m-sec-title">습득 스킬 (${items.length}종)</div>
    <div class="skill-tabs">${tabsHtml}</div>
    <input id="m-skill-q" class="skill-filter-input" type="search" placeholder="이 유닛의 스킬명·효과 검색..." value="${esc(modalSkillQuery)}" oninput="onModalSkillInput(this.value)">
    <div class="skill-grid" id="m-skill-list">${cardsHtml}</div>`;

  if (keepInputFocus && document.getElementById('m-skill-list')) {
    document.getElementById('m-skill-list').innerHTML = cardsHtml;
  } else {
    sec.innerHTML = html;
  }
}

function openUnit(uid) {
  const info = unitInfo(uid);
  const [ko, jp, rarity, maxLv, stats, tmrKey, stmrKey, , roles] = info;
  currentUid = uid;
  currentMotion = '1idle';
  modalSkillTab = 'all';
  modalSkillQuery = '';
  const rMeta = RAR_META[rarity] || { label: `★${rarity || '?'}`, cls: 'rb-r12' };

  document.getElementById('m-title').innerHTML =
    `<span class="rbadge ${rMeta.cls}">${rMeta.label}</span><span>${esc(ko)}</span>${roleBadgesHtml(roles)}`;
  document.getElementById('m-sub').textContent =
    `${jp ? jp + ' · ' : ''}ID: ${uid}${maxLv ? ' · 최대 Lv.' + maxLv : ''}`;

  document.getElementById('motion-bar').innerHTML = MOTIONS.map(([m, label]) =>
    `<button class="pill${m === currentMotion ? ' active' : ''}" data-m="${m}" onclick="setMotion('${m}')">${label}</button>`
  ).join('');

  const statNames = ['HP', 'MP', '공격', '방어', '마력', '정신'];
  const statsSec = document.getElementById('m-stats-sec');
  if (Array.isArray(stats) && stats.some(v => v > 0)) {
    statsSec.innerHTML = `<div class="m-sec-title">기본 최대 능력치 (포트 제외)</div>
      <div class="stat-grid">${statNames.map((k, i) =>
        `<div class="stat-box"><div class="stat-k">${k}</div><div class="stat-v">${Number(stats[i] || 0).toLocaleString()}</div></div>`
      ).join('')}</div>`;
  } else {
    statsSec.innerHTML = '';
  }

  const trustCards = [
    renderTrustCard('TMR', 'tb-tmr', tmrKey),
    renderTrustCard('STMR', 'tb-stmr', stmrKey),
  ].filter(Boolean).join('');
  document.getElementById('m-trust-sec').innerHTML = trustCards
    ? `<div class="m-sec-title">트러스트 / 슈퍼 트러스트 보상 (TMR · STMR)</div><div class="trust-list">${trustCards}</div>`
    : '';

  renderModalSkills(uid);

  const appears = [];
  for (const b of DATA.banners) {
    const nHit = b.native.find(e => e[0] === uid);
    if (nHit) appears.push({ b, pct: nHit[2], kind: '자체 풀' });
    else {
      const fHit = b.filler.find(e => e[0] === uid);
      if (fHit) appears.push({ b, pct: fHit[2], kind: '공용 ★3~4 풀' });
    }
  }
  document.getElementById('m-appear-sec').innerHTML =
    `<div class="m-sec-title">출현 배너 (${appears.length}곳)</div>` +
    `<div class="appear-list">${appears.map(({ b, pct, kind }) =>
      `<div class="appear-row" onclick="jumpToBanner('${esc(b.id)}')">
        <div class="appear-left">
          <div class="appear-name">${esc(b.name)} <span class="bid">#${esc(b.id)}</span></div>
          <div class="appear-meta">${esc(TAB_LABELS[b.tab] || b.tab)} · ${kind}</div>
        </div>
        <div class="appear-rate">${fmtRate(pct)}</div>
      </div>`
    ).join('')}</div>`;

  document.getElementById('unit-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  loadStageImage();
  if (location.hash !== '#unit=' + uid) {
    history.replaceState(null, '', '#unit=' + uid);
  }
}

function closeUnit() {
  document.getElementById('unit-modal').classList.remove('open');
  document.body.style.overflow = '';
  currentUid = null;
  if (location.hash.startsWith('#unit=')) {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function onModalBackdrop(e) {
  if (e.target.id === 'unit-modal') closeUnit();
}

function copyUnitLink() {
  if (!currentUid) return;
  const url = location.href.split('#')[0] + '#unit=' + currentUid;
  const btn = document.getElementById('btn-copy-link');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = '복사됨!';
      setTimeout(() => { btn.textContent = '링크 복사'; }, 1500);
    });
  } else {
    prompt('유닛 상세 링크:', url);
  }
}

function jumpToBanner(bid) {
  closeUnit();
  viewMode = 'banners';
  document.querySelectorAll('#view-toggle button').forEach(el => el.classList.toggle('active', el.dataset.view === 'banners'));
  activeTab = 'all';
  activeRar = 'all';
  activeRole = 'all';
  document.querySelectorAll('#tab-pills .pill').forEach(el => el.classList.toggle('active', el.dataset.tab === 'all'));
  document.querySelectorAll('#rar-pills .pill').forEach(el => el.classList.toggle('active', el.dataset.rar === 'all'));
  document.querySelectorAll('#role-pills .pill').forEach(el => el.classList.toggle('active', el.dataset.role === 'all'));
  expanded.add(bid);
  render();
  const el = document.getElementById('card-' + bid);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleCard(bid) {
  if (expanded.has(bid)) expanded.delete(bid);
  else expanded.add(bid);
  render();
}

function toggleAll(open) {
  expanded.clear();
  if (open) {
    for (const b of DATA.banners) expanded.add(b.id);
  }
  render();
}

function setTab(tab) {
  activeTab = tab;
  quickLimit = 48;
  document.querySelectorAll('#tab-pills .pill').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  render();
}

function setRar(rar) {
  activeRar = rar;
  quickLimit = 48;
  document.querySelectorAll('#rar-pills .pill').forEach(el => {
    el.classList.toggle('active', el.dataset.rar === rar);
  });
  render();
}

function setRole(role) {
  activeRole = role;
  quickLimit = 48;
  document.querySelectorAll('#role-pills .pill').forEach(el => {
    el.classList.toggle('active', el.dataset.role === role);
  });
  render();
}

function setScope(scope) {
  searchScope = scope;
  quickLimit = 48;
  document.querySelectorAll('#scope-pills .pill').forEach(el => {
    el.classList.toggle('active', el.dataset.scope === scope);
  });
  render();
}

function setView(mode) {
  viewMode = mode;
  quickLimit = 48;
  document.querySelectorAll('#view-toggle button').forEach(el => {
    el.classList.toggle('active', el.dataset.view === mode);
  });
  render();
}

function applyExample(text) {
  query = text;
  quickLimit = 48;
  document.getElementById('q').value = text;
  render();
}

function clearSearch() {
  query = '';
  quickLimit = 48;
  document.getElementById('q').value = '';
  render();
}

let timer = null;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    query = e.target.value;
    quickLimit = 48;
    render();
  }, 120);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && currentUid) closeUnit();
});

render();
if (location.hash.startsWith('#unit=')) {
  const uid = location.hash.slice(6).trim();
  if (DATA.units[uid]) openUnit(uid);
}
</script>
